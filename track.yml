description: |-
  This is the complete Ransomware Ecosystem self-paced course delivered as a single track. Eight modules cover the full picture: the criminal and defender ecosystem, the kill chain, negotiation, recovery architecture, legal and regulatory obligations, tabletop scenarios, global cost data, and the Illumio breach containment response.

  Each assignment covers one full module. Work through them in order or skip to the module most relevant to your current role or incident.

  Estimated completion time: 20–25 hours (full course) or 2–4 hours per module
  Audience: Security professionals and SOC analysts
